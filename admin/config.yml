backend:
  name: github
  repo: SirFrederickG/N-Vision-Website # MUST be your repository name
  branch: main # Default branch for your content (typically 'main' or 'master')

media_folder: "static/img" # Folder where all uploaded images will be stored
public_folder: "/img"      # The folder in your site where images are displayed from

# --- COLLECTIONS --- (Example content structure)
collections:
  - name: "pages"
    label: "Pages"
    folder: "content/pages" 
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Template", name: "template", widget: "hidden", default: "page"}

  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Template", name: "template", widget: "hidden", default: "post"}
