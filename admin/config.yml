backend:
  name: github
  repo: SirFrederick9/N-Vision-Website 
  branch: main
  base_url: https://api.netlify.com 

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  # General Pages (Home, Services)
  - name: "pages"
    label: "Website Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Body Content"
            name: "body"
            widget: "markdown"

  # Combined Portfolio (Photos & Videos)
  - name: "portfolio"
    label: "Portfolio Items"
    folder: "content/portfolio"
    create: true
    slug: "{{title}}"
    fields:
      - label: "Item Title"
        name: "title"
        widget: "string"
        required: true
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Photo", "Video"]
        default: "Photo"
        required: true
      - label: "Media Upload (Photo Only)"
        name: "image"
        widget: "image"
        required: false
        hint: "Upload your high-quality photo here."
      - label: "Video URL (Video Only)"
        name: "video_url"
        widget: "string"
        required: false
        hint: "Paste the full public URL for the video (e.g., YouTube, Vimeo link)."
      - label: "Alt Text / Description"
        name: "alt"
        widget: "string"
        required: true
        hint: "A brief, descriptive text for accessibility and SEO."
